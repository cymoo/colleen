services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-colleen_app}
      POSTGRES_USER: ${DB_USER:-colleen}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-colleen}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-colleen} -d ${DB_NAME:-colleen_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
